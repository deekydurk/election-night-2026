<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>civicAPI test</title>
<style>body{font:15px/1.4 system-ui;margin:16px;background:#111;color:#eee}pre{white-space:pre-wrap;word-break:break-all;background:#222;padding:8px;border-radius:6px}.ok{color:#7f7}.bad{color:#f77}</style></head>
<body><h2>civicAPI live-feed test</h2><p>Screenshot this page and send it to Claude.</p><div id="out"></div>
<script>
const out=document.getElementById('out');
const log=(cls,t)=>{const p=document.createElement('pre');p.className=cls;p.textContent=t;out.appendChild(p);};
const urls=[
 'https://civicapi.org/api/v2/status',
 'https://civicapi.org/api/v2/races',
 'https://civicapi.org/api/v2/races?year=2026',
 'https://civicapi.org/api/v2/races?date=2026-11-03',
 'https://civicapi.org/api/v2/search?q=Georgia%20Senate',
 'https://civicapi.org/api/v2/races/search?q=Georgia%20Senate',
 'https://civicapi.org/api/v2/race/search?q=Georgia%20Senate',
 'https://civicapi.org/api/v2/elections',
 'https://civicapi.org/api/v2/elections/2026',
 'https://civicapi.org/api/v2/race/3827'
];
(async()=>{for(const u of urls){try{const r=await fetch(u);const t=await r.text();log(r.ok?'ok':'bad',u+'\nHTTP '+r.status+'\n'+t.slice(0,700));}catch(e){log('bad',u+'\nBLOCKED in browser: '+e.message);}}})();
</script></body></html>
